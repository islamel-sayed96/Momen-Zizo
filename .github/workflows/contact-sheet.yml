name: Contact sheet

# Builds a numbered contact sheet of Drive photos (by file id) so photos can be
# identified without opening Drive. Pushes sheet.jpg to the contact-sheet branch.
on:
  workflow_dispatch:
    inputs:
      ids:
        description: Comma-separated Google Drive file ids
        required: true

permissions:
  contents: write

jobs:
  sheet:
    runs-on: ubuntu-latest
    steps:
      - name: Build sheet
        env:
          IDS: ${{ inputs.ids }}
        run: |
          pip install -q pillow
          python3 - <<'PY'
          import os, io, urllib.request
          from PIL import Image, ImageDraw
          ids = [i.strip() for i in os.environ['IDS'].split(',') if i.strip()]
          W, H, cols = 420, 300, 4
          rows = (len(ids) + cols - 1) // cols
          sheet = Image.new('RGB', (cols * W, rows * (H + 30)), (20, 20, 20))
          d = ImageDraw.Draw(sheet)
          for n, i in enumerate(ids):
              x, y = (n % cols) * W, (n // cols) * (H + 30)
              try:
                  data = urllib.request.urlopen(f'https://drive.google.com/thumbnail?id={i}&sz=w600', timeout=60).read()
                  im = Image.open(io.BytesIO(data)).convert('RGB'); im.thumbnail((W - 10, H - 10))
                  sheet.paste(im, (x + 5, y + 5))
              except Exception as e:
                  d.text((x + 10, y + 10), f'ERR {e}'[:60], fill=(255, 80, 80))
              d.text((x + 8, y + H + 6), f'{n + 1}  {i[:14]}', fill=(240, 200, 120))
          sheet.save('sheet.jpg', quality=82)
          PY
      - name: Push
        run: |
          git init -q out && cd out && mv ../sheet.jpg . && git checkout -q -b contact-sheet
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sheet.jpg && git commit -qm "Contact sheet"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" contact-sheet
